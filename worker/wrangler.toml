# The Slack relay for the Daily Schedule (see worker/src/relay.ts and docs/slack-setup.md).
# Deploy from the main folder with:  npm run deploy:relay
# (or from this folder: npx wrangler deploy --config wrangler.toml; without --config,
# Wrangler picks up the screen's built configuration and deploys the screen instead)
name = "daily-schedule-slack"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Served at https://daily-schedule-slack.<account>.workers.dev; no extra preview addresses.
workers_dev = true
preview_urls = false

[vars]
# The channel the picture goes to when Settings names none.
SLACK_CHANNEL = "C0CHSMJFFPS"
# The addresses the Scheduler's screen may send from, separated by commas,
# e.g. "https://a.example, https://b.example". "*" allows any.
# Both the old and the new address while the screen moves to the hub.
ALLOWED_ORIGIN = "https://daily-schedule.schrex.workers.dev, https://app.schreiberexcavating.com"

# Secrets, set once with `npx wrangler secret put <NAME>` (never written here):
#   SLACK_BOT_TOKEN  the Slack app's Bot User OAuth Token (xoxb-…)
#   SEND_KEY         a long random password the Settings page will also hold
