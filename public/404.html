<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Daily Schedule</title>
    <!--
      Served by Cloudflare (not_found_handling: "404-page" in wrangler.jsonc) for
      any address under /daily-schedule/ that isn't one of the pages. Plain HTML
      with no scripts, so it works even if nothing else loads.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f4f3ef;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #5b6472;
        --line: #d9d6cf;
        --accent: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #15171a;
          --card: #1e2125;
          --ink: #eceae5;
          --muted: #a3a8b0;
          --line: #33373d;
          --accent: #eceae5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover,
      a:focus-visible {
        background: var(--accent);
        color: var(--card);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's no Daily Schedule page at this address. It may have been mistyped, or the page no longer exists.</p>
      <a href="/daily-schedule/">Go to the Daily Schedule</a>
    </main>
  </body>
</html>
