<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/daily-schedule/app-icon.png" />
    <title>Page not found · Daily Schedule</title>
    <!--
      Served by Cloudflare (not_found_handling: "404-page" in wrangler.jsonc) for
      any address under /daily-schedule/ that isn't one of the pages. Plain HTML
      with no scripts, so it works even if nothing else loads. Its look is in
      404.css, not inline, so the content security policy can refuse inline
      styles (worker/src/safetyHeaders.ts).
    -->
    <link rel="stylesheet" href="/daily-schedule/404.css" />
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There's no Daily Schedule page at this address. It may have been mistyped, or the page no longer exists.</p>
      <a href="/daily-schedule/">Go to the Daily Schedule</a>
    </main>
  </body>
</html>
